[project]
name = "baton"
version = "0.1.0"
description = "Hand a coding session from one agent harness to another when the first one runs out"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Arttu Antikainen" }]
dependencies = []

[project.scripts]
baton = "baton.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/baton"]

[tool.ruff]
line-length = 110
target-version = "py311"
